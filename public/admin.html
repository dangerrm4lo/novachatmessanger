<!DOCTYPE html>
<html lang="ru">

<head>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c1e">
  <title>NovaChat · Админ-панель</title>
  <script>
    (function () {
      var pref = localStorage.getItem('novachat_theme') || 'system';
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
      document.documentElement.lang = 'ru';
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="page-admin">
  <header class="bar">
    <button id="backToChats" class="icon-btn" type="button" data-icon="chevron" data-icon-size="24"
      aria-label="Back"></button>
    <h1 class="bar-title">Админ-панель</h1>
    <span class="bar-spacer"></span>
  </header>

  <div id="adminDenied" class="admin-denied" hidden>
    <p class="empty-title">Нет доступа</p>
    <p class="empty-sub">Эта страница только для администраторов NovaChat.</p>
  </div>

  <main id="adminMain" class="admin-main" hidden>
    <section class="admin-card">
      <h2 class="admin-h">Тех. работы</h2>
      <p id="announceState" class="announce-state"></p>

      <p class="label">Закрыть через</p>
      <div id="minutesSeg" class="segmented" style="--count: 4;">
        <span class="seg-thumb"></span>
        <button type="button" class="seg" data-value="5">5 мин</button>
        <button type="button" class="seg" data-value="10">10 мин</button>
        <button type="button" class="seg" data-value="30">30 мин</button>
        <button type="button" class="seg" data-value="60">1 ч</button>
      </div>

      <p class="label">Причина</p>
      <div id="reasonSeg" class="segmented">
        <span class="seg-thumb"></span>
        <button type="button" class="seg" data-value="fix">Тех. исправления</button>
        <button type="button" class="seg" data-value="update">Обновление</button>
      </div>

      <p id="previewText" class="preview"></p>
      <button id="sendMaint" class="btn btn-primary" type="button">Отправить объявление</button>

      <p class="label">Информационное объявление</p>
      <textarea id="infoText" class="field textarea" rows="2" maxlength="300" placeholder="Текст объявления"></textarea>
      <button id="sendInfo" class="btn btn-primary" type="button">Опубликовать</button>

      <button id="endAnnounce" class="btn btn-danger" type="button">Убрать объявление и завершить тех. работы</button>
    </section>

    <section class="admin-card">
      <h2 class="admin-h">Жалобы</h2>
      <ul id="reportList" class="user-list"></ul>
      <p id="reportsEmpty" class="hint-center" hidden>Открытых жалоб нет</p>
    </section>

    <section class="admin-card">
      <h2 class="admin-h">Пользователи</h2>
      <input id="userQuery" class="field" type="search" placeholder="Юзернейм" autocomplete="off" autocapitalize="off"
        spellcheck="false">
      <ul id="userList" class="user-list"></ul>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script src="common.js"></script>
  <script src="admin-app.js"></script>
  <script src="pwa.js"></script>
</body>

</html>
